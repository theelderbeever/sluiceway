# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v4.5.0"
hooks = [
  { id = "end-of-file-fixer", exclude = '\.rs$', stages = ["pre-commit"] },
  { id = "trailing-whitespace", stages = ["pre-commit"] }
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.2.10"
hooks = [
  { id = "tombi-format", exclude = '^Cargo\.lock$' },
  { id = "tombi-lint", exclude = '^Cargo\.lock$' },
]

[[repos]]
repo = "https://github.com/doublify/pre-commit-rust"
rev = "v1.0"
hooks = [
  { id = "fmt", stages = ["pre-commit"], entry = "cargo +nightly fmt" },
  {
    id = "clippy",
    stages = ["pre-commit"],
    args = [
      "--all-targets",
      "--all",
      "--",
      "-D",
      "clippy::all",
      "-D",
      "warnings",
      "--no-deps"
    ]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-test",
    name = "Run cargo test",
    entry = "cargo test --all --",
    language = "system",
    pass_filenames = false,
    stages = ["pre-push"],
    types = ["rust"]
  }
]
