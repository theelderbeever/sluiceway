[package]
name = "sluiceway-contrib"
version.workspace = true
edition.workspace = true
description = "Optional source and sink integrations for Sluiceway pipelines"
repository.workspace = true
license.workspace = true

[[example]]
name = "kafka_json"
required-features = ["kafka"]

[dependencies]
futures-core = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
rdkafka = { workspace = true, optional = true }
sluiceway-core = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync"], optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = {
  workspace = true,
  features = ["macros", "rt-multi-thread", "signal", "time"]
}

[features]
default = []
kafka = [
  "dep:futures-core",
  "dep:futures-util",
  "dep:rdkafka",
  "dep:sluiceway-core",
  "dep:thiserror",
  "dep:tokio",
]
kafka-sasl = ["kafka", "rdkafka/curl-static", "rdkafka/gssapi-vendored"]
kafka-zstd = ["kafka", "rdkafka/zstd"]

[lints]
workspace = true
