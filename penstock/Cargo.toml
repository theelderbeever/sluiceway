[package]
name = "penstock"
version.workspace = true
edition.workspace = true
description = "Facade for the Penstock typed linear and fanout pipeline framework"

[dependencies]
penstock-core.workspace = true
penstock-io = { workspace = true, optional = true }

[dev-dependencies]
futures-core.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[features]
default = []
full = ["metrics", "object-store", "sql"]
io = ["dep:penstock-io", "penstock-io/filesystem"]
metrics = ["penstock-core/metrics"]
object-store = ["io", "penstock-io/object-store"]
sql = ["sql-mysql", "sql-postgres", "sql-sqlite"]
sql-mysql = ["io", "penstock-io/sql-mysql"]
sql-postgres = ["io", "penstock-io/sql-postgres"]
sql-sqlite = ["io", "penstock-io/sql-sqlite"]

[lints]
workspace = true
