[workspace]
resolver = "3"
members = [
  "sluiceway",
  "sluiceway-contrib",
  "sluiceway-core",
  "sluiceway-io",
]
default-members = ["sluiceway"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
repository = "https://github.com/theelderbeever/sluiceway"
license = "MIT"

[workspace.dependencies]
futures-core = "0.3.33"
futures-util = {
  version = "0.3.33",
  default-features = false,
  features = ["async-await", "std"]
}
metrics = "0.24.2"
object_store = "0.14.1"
rdkafka = {
  version = "0.39.0",
  default-features = false,
  features = ["cmake-build", "libz-static", "ssl-vendored", "tokio"]
}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sluiceway-core = { path = "sluiceway-core", version = "0.1.0-alpha.2" }
sluiceway-io = {
  path = "sluiceway-io", version = "0.1.0-alpha.2",
  default-features = false,
}
sqlx-core = { version = "=0.8.6", default-features = false }
sqlx-mysql = { version = "=0.8.6", default-features = false }
sqlx-postgres = { version = "=0.8.6", default-features = false }
sqlx-sqlite = { version = "=0.8.6", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false }
tokio-stream = { version = "0.1.19", features = ["time"] }

[workspace.lints.clippy]
all = "warn"
complexity = { level = "warn", priority = -1 }
expect_used = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
